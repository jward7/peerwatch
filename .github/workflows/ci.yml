name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rails 8.0 and 8.1 both require Ruby >= 3.2.
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["8.0", "8.1"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  postgres:
    name: Ruby 3.4 / Rails 8.1 / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: peerwatch
          POSTGRES_PASSWORD: peerwatch
          POSTGRES_DB: peerwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_VERSION: "8.1"
      BUNDLE_WITH: postgres
      DATABASE_URL: postgres://peerwatch:peerwatch@localhost:5432/peerwatch_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
